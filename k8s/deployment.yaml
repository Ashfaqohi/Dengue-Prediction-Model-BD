apiVersion: apps/v1
kind: Deployment
metadata:
  name: dengue-api
  labels:
    app: dengue-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dengue-api
  template:
    metadata:
      labels:
        app: dengue-api
    spec:
      containers:
        - name: dengue-api
          image: dengue-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
